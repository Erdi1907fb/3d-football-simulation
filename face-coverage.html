<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next90 Sim · Yüz Kapsamı</title><link rel="stylesheet" href="assets/penalty.css?v=265"><style>table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #294652}details{margin:24px 0}li{padding:5px}input{padding:12px;width:min(90%,400px);background:#10212d;border:1px solid #486273;color:#fff;border-radius:8px}.scroll{overflow-x:auto}summary{cursor:pointer}small{color:#afc6d0}</style><script defer src="assets/head-fit.js?v=265"></script><script defer src="assets/player-heads.js?v=265"></script><script defer src="assets/head-coverage.js?v=265"></script></head><body><main><header><a href="index.html" id="home">Ana sayfa</a><a class="language" href="face-coverage.html?lang=en">EN / TR</a><span>Next90 Sim</span></header><h1 id="title">Oyuncu yüzleri</h1><p id="summary" role="status"></p><p id="note"></p><input id="search" type="search" aria-label="Takım ara" placeholder="Takım ara"><div class="scroll"><table><thead><tr><th id="club">Takım</th><th id="total">Kadro</th><th id="real">Gerçek 3D kafa</th><th id="photos">Fotoğraf</th><th id="fallback">Temsili yüz</th></tr></thead><tbody id="rows"></tbody></table></div><details><summary id="missing">Henüz gerçek modeli bulunmayan oyuncular</summary><p id="fallbackNote"></p><div id="list"></div></details></main><script>
addEventListener('DOMContentLoaded',async()=>{const en=new URLSearchParams(location.search).get('lang')==='en',tr=(a,b)=>en?b:a,copy={home:'Home',title:'Player faces',club:'Team',total:'Squad',real:'Real 3D head',photos:'Photograph',fallback:'Generic face',missing:'Players without a real head model yet'};document.documentElement.lang=en?'en':'tr';if(en){for(const[id,text]of Object.entries(copy))document.getElementById(id).textContent=text;document.querySelector('.language').href='face-coverage.html';document.getElementById('search').placeholder='Search teams';document.getElementById('search').setAttribute('aria-label','Search teams');}try{const[registry,heads,photos]=await Promise.all(['assets/club-rosters-v75.json','assets/heads/manifest.json','assets/faces/player-portraits.json'].map(url=>fetch(url+'?v=265').then(r=>{if(!r.ok)throw Error('coverage');return r.json();}))),coverage=Next90HeadCoverage.build(registry,heads,photos),all=coverage.rows.reduce((a,r)=>{for(const k of['total','real','photo','generic'])a[k]+=r[k];return a;},{total:0,real:0,photo:0,generic:0});window.Next90FaceCoverage=coverage;document.getElementById('summary').textContent=coverage.models+tr(' gerçek kafa modeli · ',' real head models · ')+coverage.rows.length+tr(' takımın tüm kadrosunda ortak sistem',' complete team squads supported');document.getElementById('note').textContent=tr('Gerçek modeli bulunan oyuncular aynı iskelet, ten ve forma sistemini kullanır. Modeli olmayan oyuncuda mevcut doğrulanmış fotoğrafı; fotoğraf da yoksa mevcut temsili yüzü korunur. Sayılar oyuncu kadrosuna göre hesaplanır; bir oyuncu kulüp ve millî takımında ayrı sayılabilir.','Real head models use the shared skeleton, skin and kit system. Players without a model retain their verified photograph, or the existing generic face where no photograph is available. Counts follow squad entries; a player can appear for both club and country.');document.getElementById('fallbackNote').textContent=tr('Gerçek model eksikleri aşağıda ayrı gösterilir. Fotoğraf, gerçek 3D model olarak sayılmaz.','Missing real models are listed below. A photograph is not counted as a real 3D model.');function draw(){const q=document.getElementById('search').value.toLocaleLowerCase(en?'en':'tr'),rows=document.getElementById('rows'),list=document.getElementById('list');rows.replaceChildren();list.replaceChildren();for(const r of coverage.rows.filter(r=>r.name.toLocaleLowerCase(en?'en':'tr').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,en?'en':'tr'))){const row=document.createElement('tr');for(const value of[r.name,r.total,r.real,r.photo,r.generic]){const td=document.createElement('td');td.textContent=value;row.append(td);}rows.append(row);const missing=r.players.filter(p=>p.kind!=='real');if(missing.length){const details=document.createElement('details'),summary=document.createElement('summary'),ul=document.createElement('ul');summary.textContent=r.name+' · '+missing.length;details.append(summary);for(const p of missing){const li=document.createElement('li');li.textContent=p.name+' · '+(p.kind==='photo'?tr('Mevcut fotoğrafı korunuyor','Existing photograph retained'):tr('Mevcut temsili yüz','Existing generic face'));ul.append(li);}details.append(ul);list.append(details);}}}document.getElementById('search').addEventListener('input',draw);draw();}catch{document.getElementById('summary').textContent=tr('Kapsam bilgisi yüklenemedi.','Coverage data could not be loaded.');}});
</script></body></html>
