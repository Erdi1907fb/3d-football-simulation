<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next90 Sim · Yüz Kapsamı</title><link rel="stylesheet" href="assets/penalty.css?v=170"><style>table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #294652}details{margin:24px 0}li{padding:5px}</style></head><body><main><header><a href="index.html" id="home">Ana sayfa</a><a class="language" href="face-coverage.html?lang=en">EN / TR</a><span>Next90 Sim</span></header><h1 id="title">Yüz kapsamı</h1><p id="summary"></p><p id="note"></p><table><thead><tr><th id="club">Takım</th><th id="total">Oyuncu</th><th id="photos">Portre</th><th id="fallback">Temsili yüz</th></tr></thead><tbody id="rows"></tbody></table><details><summary id="missing">Portresi bulunamayan oyuncular</summary><ul id="list"></ul></details></main><script>
(async()=>{const en=new URLSearchParams(location.search).get('lang')==='en',copy={home:'Home',title:'Face coverage',club:'Club',total:'Players',photos:'Portraits',fallback:'Generic faces',missing:'Players without an available portrait'};document.documentElement.lang=en?'en':'tr';if(en){for(const[id,text]of Object.entries(copy))document.getElementById(id).textContent=text;document.querySelector('.language').href='face-coverage.html';}const[d,clubs]=await Promise.all([fetch('assets/faces/player-portraits.json?v=170').then(r=>r.json()),fetch('assets/bsd-clubs.json?v=170').then(r=>r.json())]);const names=Object.fromEntries(Object.values(clubs.teams).map(t=>[t.catalogId,t.name]));document.getElementById('summary').textContent=d.summary.downloaded+' / '+d.summary.players+(en?' player portraits · ':' oyuncu portresi · ')+d.summary.clubs+(en?' clubs':' kulüp');document.getElementById('note').textContent=en?'Photographic fronts on stylised heads, not scanned 3D faces. Missing photographs keep the existing generic model. Squad membership follows the current data sources; this list describes the included snapshot.':'Fotoğraflar temsili kafa modelinin ön yüzünde kullanılır; taranmış 3D yüz değildir. Fotoğraf bulunmayan oyuncuda mevcut temsili model korunur. Bu liste paketteki kayıt anını gösterir; kadrolar güncel veri kaynaklarından izlenir.';const staff=await fetch('assets/faces/staff-portraits.json?v=170').then(r=>r.json()).catch(()=>({summary:{}}));document.getElementById('note').textContent+=(en?' Manager portraits: ':' Teknik direktör portresi: ')+(staff.summary.managerPortraits||0)+(en?'. Referees and other staff use generic anatomical faces.':'. Hakem ve diğer saha görevlilerinde temsili anatomik yüzler kullanılır.');for(const[id,c]of Object.entries(d.coverage).sort((a,b)=>(names[a[0]]||a[0]).localeCompare(names[b[0]]||b[0]))){const row=document.createElement('tr');for(const value of[names[id]||id,c.total,c.downloaded,c.total-c.downloaded]){const td=document.createElement('td');td.textContent=value;row.append(td);}document.getElementById('rows').append(row);}for(const p of d.missing){const li=document.createElement('li');li.textContent=(names[p.team]||p.team)+' · '+p.name;document.getElementById('list').append(li);}})().catch(()=>{document.getElementById('summary').textContent='Coverage data could not be loaded.'});
</script></body></html>
